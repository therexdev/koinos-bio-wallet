# Builds the Android app (a Trusted Web Activity around wallet.usekoinos.com)
# and publishes the APK/AAB as workflow artifacts. Runs on pushes that touch
# the Android project and on demand.
#
# Signing: add these repository secrets to get a release-signed build —
#   ANDROID_KEYSTORE_BASE64   base64 of your .jks   (base64 -w0 release.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the build is signed with a debug key: fine for sideloading
# and testing, not for Play, and the site's assetlinks.json will not match
# it (so the URL bar shows). That debug key is cached between runs so a
# newer build still installs over an older one; if the cache is evicted a
# fresh key appears and phones must uninstall the old build once. The log
# and the job summary print the SHA-256 fingerprint of whichever
# certificate signed the build — the value for ANDROID_SHA256_FINGERPRINTS.
#
# Every successful build on main also refreshes the "android-latest"
# pre-release, so the newest APK is always at
#   https://github.com/<owner>/<repo>/releases/download/android-latest/bio-wallet.apk
# (a raw .apk a phone can install directly, unlike the zipped artifact).
name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name (e.g. 1.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: ${{ github.event.inputs.versionName != '' && github.event.inputs.versionName || format('1.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Keep the debug signing key between builds
        if: env.HAS_RELEASE_KEY != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Release keystore from secrets
        if: env.HAS_RELEASE_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build APK and App Bundle
        working-directory: android
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Rename outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/bio-wallet-${ANDROID_VERSION_NAME}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/bio-wallet-${ANDROID_VERSION_NAME}.aab"

      - name: Verify the APK signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "out/bio-wallet-${ANDROID_VERSION_NAME}.apk" | grep -E 'Verified using|Verifies|SHA-256|WARNING' || true
          "$APKSIGNER" verify "out/bio-wallet-${ANDROID_VERSION_NAME}.apk"

      - name: Signing certificate fingerprint (for assetlinks.json)
        run: |
          FP=$(keytool -printcert -jarfile out/bio-wallet-${ANDROID_VERSION_NAME}.apk | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          echo "Signing certificate SHA-256: $FP"
          echo "ANDROID_SHA256_FINGERPRINTS=$FP"
          KIND=$([ "$HAS_RELEASE_KEY" = "true" ] && echo "release key" || echo "DEBUG key — add the signing secrets for a real build")
          {
            echo "## Bio Wallet Android build ${ANDROID_VERSION_NAME} (versionCode ${ANDROID_VERSION_CODE})"
            echo
            echo "Signed with the **${KIND}**."
            echo
            echo "SHA-256 fingerprint of the signing certificate:"
            echo
            echo '```'
            echo "$FP"
            echo '```'
            echo
            echo "Set this on the wallet server so Chrome verifies the app and hides the URL bar:"
            echo
            echo '```'
            echo "ANDROID_SHA256_FINGERPRINTS=$FP"
            echo '```'
            echo
            echo "Then check https://wallet.usekoinos.com/.well-known/assetlinks.json contains it."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bio-wallet-android-${{ env.ANDROID_VERSION_NAME }}
          path: out/*
          if-no-files-found: error

      # The newest build, as a raw APK at a link that never changes.
      - name: Refresh the android-latest pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "out/bio-wallet-${ANDROID_VERSION_NAME}.apk" out/bio-wallet.apk
          git tag -f android-latest
          git push -f origin android-latest
          KIND=$([ "$HAS_RELEASE_KEY" = "true" ] && echo "the release key" || echo "a debug key (set the signing secrets for a real one)")
          printf '%s\n' \
            "Latest build of the Bio Wallet Android app from main: version ${ANDROID_VERSION_NAME}, signed with ${KIND}." \
            "" \
            "**Install:** download bio-wallet.apk on the phone, open it, and allow installs from your browser or file manager when asked." \
            "" \
            "**\"App not installed\"?** Usually one of these:" \
            "- a build signed with a different key is already on the phone: uninstall Bio Wallet, then install again;" \
            "- you opened the .aab file: that one is for the Play Store, phones install the .apk;" \
            "- the download was cut short: download it again;" \
            "- the phone blocked the install: Settings, Apps, Special app access, Install unknown apps." \
            > "$RUNNER_TEMP/notes.md"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --prerelease --title "Bio Wallet for Android — latest build (${ANDROID_VERSION_NAME})" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create android-latest --prerelease --title "Bio Wallet for Android — latest build (${ANDROID_VERSION_NAME})" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload android-latest out/bio-wallet.apk "out/bio-wallet-${ANDROID_VERSION_NAME}.apk" "out/bio-wallet-${ANDROID_VERSION_NAME}.aab" --clobber
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/android-latest/bio-wallet.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Attach to a versioned release (android-v* tags only)
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
